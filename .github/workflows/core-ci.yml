name: Core CI

on:
  push:
    paths:
      - ".github/workflows/core-ci.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "client/app/**"
      - "client/core/**"
      - "client/media/**"
      - "client/rtc/**"
      - "client/tools/**"
      - "deps/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
  pull_request:
    paths:
      - ".github/workflows/core-ci.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "client/app/**"
      - "client/core/**"
      - "client/media/**"
      - "client/rtc/**"
      - "client/tools/**"
      - "deps/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            configure-preset: dev
            build-preset: build-dev
            test-preset: test-dev
          - os: windows-2022
            configure-preset: windows-dev
            build-preset: build-windows-dev
            test-preset: test-windows-dev

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show tool versions
        run: cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }}

      - name: Test
        run: ctest --preset ${{ matrix.test-preset }}
